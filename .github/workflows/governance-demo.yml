name: Bounty-Hive Governance Demo

on:
  workflow_dispatch:
  push:

jobs:
  governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Demo Repo
        uses: actions/checkout@v4

      - name: Checkout Private Bounty-Hive Repo
        uses: actions/checkout@v4
        with:
          repository: Lift3dL3g3nd/bounty-hive
          ref: core-freeze
          token: ${{ secrets.BOUNTYHIVE_TOKEN }}
          path: bounty-hive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bounty-Hive Engine
        run: |
          cd bounty-hive
          pip install -e .

      # ✅ ORIGINAL STEP (unchanged)
      - name: Run Bounty-Hive Governance
        run: |
          bounty-hive run demo_program --out-dir demo_program/output

      # 🔥 NEW STEP 1: simulate policy/context drift
      - name: Simulate Policy Drift
        run: |
          echo '{"policy": "modified_context"}' > demo_program/policies/red_team_only_policy.json

      # 🔥 NEW STEP 2: attempt reuse under new context
      - name: Attempt Reuse Under Drift
        run: |
          bounty-hive run demo_program --out-dir demo_program/output || echo "Blocked as expected"

      - name: Write SARIF
        run: |
          bounty-hive scan demo_program --format sarif --output demo_program/output/results.sarif

      - name: Upload Governance Output
        uses: actions/upload-artifact@v4
        with:
          name: bounty-hive-output
          path: demo_program/output
